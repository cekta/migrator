services:
  mysql:
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: 12345
      MYSQL_DATABASE: app
    ports:
      - "3306:3306"

  pgsql:
    image: postgres
    environment:
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres-d ${POSTGRES_DB} -q"]
      interval: 60s
      timeout: 1s
      retries: 10
      start_period: 30s
      start_interval: 1s

  app:
    build:
      context: ./
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
      target: app
    depends_on:
      pgsql:
        condition: service_healthy
      mysql:
        condition: service_started
    volumes:
      - ./:/app
    working_dir: /app
    user: "${UID:-1000}:${GID:-1000}"
    tty: true
    environment:
      - PHP_IDE_CONFIG=serverName=docker

  pages:
    image: peaceiris/mdbook:latest
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
    working_dir: /app
    command:
      - serve
      - -n
      - 0.0.0.0
